<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pymear / signal panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">pymear</span>
      <span class="brand-sep">/</span>
      <span class="brand-sub">signal panel</span>
    </div>
    <div class="hint">click trigger to publish an event on the internal bus</div>
  </header>

  <main id="grid"></main>

  <footer>
    <div class="feed-title">
      <span>printout</span>
      <button id="feed-clear" class="ghost-btn">clear log</button>
    </div>
    <div id="feed"></div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
