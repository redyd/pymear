[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymear"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "twitchio>=2.10,<3.0",
    "aiohttp",
    "python-dotenv",
    "pyttsx3",
    "elevenlabs",
    "pyaudio"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymear = ["client/static/*.js"]
